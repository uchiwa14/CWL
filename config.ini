; =====================================================================
;  CWL (Chrome Workspace Launcher) Ver1.0  設定ファイル
;  ・すべての設定はこのファイルで管理します。
;  ・Account セクションを増やすだけでアカウントを追加できます。
;    （[Accounts] の Count を合わせて増やしてください）
; =====================================================================

[General]
; 業務で開くURL
URL=https://ksas.kubota.co.jp/ksas/farming/users/login

; 表示モード:  Auto / External / Notebook
;   Auto     … 外付けがあれば外付け、無ければノートPCへ自動切替
;   External … 常に外付けモニタを使用（無ければAutoにフォールバック）
;   Notebook … 常にノートPC(プライマリ)を使用
DisplayMode=Auto

; Chrome実行ファイルのパス（空欄なら自動検出）
ChromePath=

; ログ出力（1=有効 / 0=無効）
LogEnabled=1
LogFile=CWL.log

; 新規ウィンドウ出現待ちの最大時間(ミリ秒)
WindowWaitMs=10000
; 各アカウント起動の間隔(ミリ秒)
LaunchIntervalMs=800

[Monitor]
; この幅(px)以上のモニタを「外付け」とみなす（Auto/External判定用）
ExternalMinWidth=2560

[Accounts]
; アカウント数（可変）。[Account1]〜[AccountN] を用意してください。
Count=3

; ---------------------------------------------------------------------
;  レイアウト比率 X,Y,W,H は対象モニタの作業領域に対する 0.0〜1.0 の割合。
;  例) X=0.0 Y=0.0 W=0.5 H=0.5  → 左上 1/4
; ---------------------------------------------------------------------
[Account1]
Name=Default_Profile_Name
Folder=Default
X=0.0
Y=0.0
W=0.5
H=0.5

[Account2]
Name=Profile_Name01
Folder=Profile X
X=0.5
Y=0.0
W=0.5
H=0.5

[Account3]
Name=Profile_Name02
Folder=Profile Y
X=0.0
Y=0.5
W=1.0
H=0.5
